name: ML CI CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # CI Stage
  ci_stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and Run ML Program
        run: python model.py

      - name: Update index.html with Actual Accuracy
        run: |
          ACC=$(cat accuracy.txt)
          sed -i "s/ACCURACY_PLACEHOLDER/$ACC/g" index.html

      - name: Save Updated HTML as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-index
          path: index.html

      - name: Execute Test Cases
        run: pytest test_model.py

  # CD Stage
  cd_stage:
    needs: ci_stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Updated HTML Artifact
        uses: actions/download-artifact@v4
        with:
          name: updated-index
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
